version: "3.9"
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: telemetry-rabbitmq
    ports:
      - "5672:5672"     # AMQP — C++ publisher + Spring Boot consumer
      - "15672:15672"   # Management UI — http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER:  ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS:  ${RABBITMQ_PASS}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      - source: rabbitmq_config
        target: /etc/rabbitmq/rabbitmq.conf
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 15s
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: telemetry-mongodb
    ports:
      - "27017:27017"   
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE:      ${MONGO_DB}
    volumes:
      - ./infra/mongo/init-collections.js:/docker-entrypoint-initdb.d/init-collections.js:ro
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout:  5s
      retries:  5
      start_period: 20s
    restart: unless-stopped
 
volumes:
  rabbitmq_data:
    driver: local
  mongodb_data:
    driver: local
 
configs:
  rabbitmq_config:
    content: |
      load_definitions = /etc/rabbitmq/definitions.json
      heartbeat = 60
      management.tcp.port = 15672
      log.console = true
      log.console.level = info
 